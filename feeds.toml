# External sources of UniXNU. "commit" pins a source; "path" (optional) fetches only that
# subdirectory with a shallow, blobless, sparse checkout. A device repository may add its own
# feeds.toml, and a local = "DIR" entry (or the unixnu command line) points a source at a local tree.
# These are Apple open source references and edk2; none of them is copied into a UniXNU repository.

[[source]]
name = "xnu"
kind = "refer"
git = "https://github.com/apple-oss-distributions/xnu.git"
ref = "xnu-10063.141.1"
commit = "d8b80295118ef25ac3a784134bcf95cd8e88109f"
# Everything that depends on the Darwin version is set here and passed to the kernel scripts.
darwin = "23.6.0"
version = "10063.141.1"
driverkit_tag = "xnu-10063.121.3"    # earlier tag that still has iokit/DriverKit headers
trustcache_tag = "xnu-8796.101.5"    # earlier tag that still has EXTERNAL_HEADERS/TrustCache

